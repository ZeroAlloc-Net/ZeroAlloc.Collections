name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0.x and 9.0.x are the runtimes the multi-targeted tests execute on.
          # global-json-file installs the SDK global.json actually pins: without it
          # this job never installs a 10.x SDK at all and only builds because the
          # runner image happens to ship one that satisfies the pin. The moment
          # global.json moves ahead of the image, the job fails to find any SDK.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Calculate version
        id: gitversion
        run: |
          version=$(dotnet dotnet-gitversion /output json /showvariable SemVer)
          echo "semver=$version" >> $GITHUB_OUTPUT
          echo "Calculated version: $version"

      - name: Restore
        run: dotnet restore ZeroAlloc.Collections.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Collections.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ZeroAlloc.Collections.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/*.trx"

  aot-smoke:
    runs-on: ubuntu-latest
    # Typical run is under a minute. The bound makes a NativeAOT hang, like dotnet/runtime#134799,
    # fail fast instead of burning the default six-hour job limit.
    timeout-minutes: 15
    # Publishes samples/ZeroAlloc.Collections.AotSmoke with PublishAot=true and runs
    # the binary. Exercises the heap and ref struct collections, the dictionaries and a
    # generator-emitted list, with reference, primitive, enum, struct and nullable arguments.
    # The sample targets net10.0 so the publish uses the net10 ILCompiler, where NativeAOT
    # codegen bugs such as dotnet/runtime#134799 live; it consumes the lib's net9.0 asset.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install AOT native toolchain
        # NativeAOT links with clang and the zlib headers. The runner image ships clang, so apt
        # runs only for what is missing. apt has no network timeout of its own: a stalled mirror
        # used to hang this step until the job timed out. See ZeroAlloc-Net/.github#47.
        timeout-minutes: 5
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -z "$missing" ]; then
            echo "clang and zlib1g-dev are already installed"
            exit 0
          fi
          echo "Installing:$missing"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $missing

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Collections.AotSmoke/ZeroAlloc.Collections.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Collections.AotSmoke/ZeroAlloc.Collections.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        # GNU timeout exits 124 when the binary hangs, so a hang fails the step within two minutes.
        run: timeout --kill-after=10s 120s ./aot-out/ZeroAlloc.Collections.AotSmoke

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
